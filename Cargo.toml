[package]
name = "superint-video"
version = "0.3.0"
edition = "2024"
description = "Local HTML video authoring, preview and rendering"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
walkdir = "2"
mime_guess = "2"
include_dir = "0.7"
chromiumoxide = "0.9.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "multipart", "stream"] }
base64 = "0.22"
hound = "3.5"
ebur128 = "0.1.11"
# Style files. Deflate only, through the pure-Rust backend the image decoder already brings.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
