<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Superint Video preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101113}
    #viewport{position:absolute;inset:0;overflow:hidden}
    #stage{position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;isolation:isolate}
    .layer{position:absolute;inset:0;transform-origin:50% 50%;visibility:hidden;overflow:hidden}
    .layer iframe,.layer img{display:block;border:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
    #error{position:absolute;left:16px;right:16px;bottom:16px;max-height:45%;overflow:auto;background:#27191b;color:#ffdadd;padding:12px 16px;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;border:1px solid #884952;display:none}
  </style>
</head>
<body>
  <div id="viewport"><div id="stage" aria-label="Video composition"></div></div>
  <div id="error" role="alert"></div>
  <script type="module" src="/runtime/player.js"></script>
</body>
</html>
