name: Windows build

# Runs the same checks as ./scripts/build.ps1 for every pull request, every push to main and
# release tags. Documentation-only changes skip it.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["**.md", "docs/images/**", ".github/ISSUE_TEMPLATE/**"]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/images/**", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.0"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.99.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and checks
        run: ./scripts/build.ps1

      - name: Studio formatting
        working-directory: studio
        run: npm run format:check

      - name: Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: superint-video-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
