<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../kit/theme.css">
  <style>
    .ui { justify-content: flex-start; }
    .caption { margin: 0; max-width: 80vw; font-size: 4.6vmin; font-weight: 900; text-wrap: balance; }
    .side { position: absolute; width: 40vmin; margin-left: -20vmin; text-align: center; }
    .side .num { font-size: 6vmin; font-weight: 1000; font-variant-numeric: tabular-nums; }
    .side .label { color: var(--muted); }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="stage" id="stage">
    <svg class="art" id="art"></svg>
    <div class="side" id="left"><div class="num" id="leftNum"></div><div class="label" id="leftLabel"></div></div>
    <div class="side" id="right"><div class="num" id="rightNum"></div><div class="label" id="rightLabel"></div></div>
  </div>
  <div class="ui"><p class="caption" id="caption"></p></div>
  <div class="vignette"></div>
  <script type="module">
    import { defineScene } from '/runtime/scene.js';
    import { fontsReady, once, fitSvg, orb, color, enter, between, drift, bob, rise, count, markup, starField, twinkle, ease } from '../kit/kit.js';

    const stage = document.getElementById('stage'), art = document.getElementById('art');
    const $ = id => document.getElementById(id);

    // Two spheres whose AREAS are proportional to the values, so the picture is honest.
    const layout = once(({ width, height }) => {
      const L = fitSvg(art, width, height);
      L.stars = starField(art, { w: width, h: height, seed: 'compare', count: 60 });
      L.slots = L.portrait
        ? [[width * 0.5, height * 0.38], [width * 0.5, height * 0.72]]
        : [[width * 0.3, height * 0.52], [width * 0.7, height * 0.52]];
      L.maxR = (L.portrait ? 17 : 21) * L.u;
      return L;
    });

    let built = null;
    defineScene({
      ready: fontsReady,
      props: {
        caption: { type: 'text', default: 'Querschnittsfläche, *Erde = 1*', label: 'Caption (*word* = accent)' },
        leftLabel: { type: 'text', default: 'Erde', label: 'Left label' },
        leftValue: { type: 'number', default: 1, label: 'Left value', min: 0 },
        leftColor: { type: 'color', default: '#45b8ff', label: 'Left color' },
        rightLabel: { type: 'text', default: 'Jupiter', label: 'Right label' },
        rightValue: { type: 'number', default: 121, label: 'Right value', min: 0 },
        rightColor: { type: 'color', default: '#ff8a3d', label: 'Right color' },
        unit: { type: 'text', default: '', label: 'Unit after values' },
        decimals: { type: 'number', default: 0, label: 'Decimals', min: 0, max: 3 },
      },
      render(context) {
        const { time, props } = context;
        const L = layout(context);
        const key = props.leftColor + props.rightColor;
        if (built?.key !== key) {
          built?.orbs.forEach(o => o.remove());
          built = { key, orbs: [orb(art, { r: 100, fill: props.leftColor, glow: true }), orb(art, { r: 100, fill: props.rightColor, glow: true, bands: 3 })] };
        }
        $('caption').innerHTML = markup(props.caption);
        rise($('caption'), enter(time, 0.05));

        const max = Math.max(props.leftValue, props.rightValue, 1e-9);
        const sides = [['left', props.leftValue, props.leftLabel], ['right', props.rightValue, props.rightLabel]];
        sides.forEach(([side, value, label], i) => {
          const at = 0.3 + i * 0.5;
          const grow = enter(time, at, { stiffness: 70, damping: 12 });
          const r = Math.max(L.u * 0.8, L.maxR * Math.sqrt(value / max));
          const [bx, by] = bob(side, time, 0.5 * L.u);
          const [x, y] = L.slots[i];
          built.orbs[i].setAttribute('transform', `translate(${x + bx} ${y + by}) scale(${(r / 100) * Math.max(0, grow)})`);
          const box = $(side);
          box.style.left = `${x}px`;
          // Landscape labels share a baseline; portrait labels hug their sphere.
          box.style.top = `${y + (L.portrait ? r : L.maxR) + 3 * L.u}px`;
          $(`${side}Num`).textContent = count(between(time, at, at + 1.2, ease.outCubic), 0, value, { decimals: props.decimals }) + (props.unit ? ` ${props.unit}` : '');
          $(`${side}Label`).textContent = label;
          rise(box, enter(time, at + 0.25));
        });
        drift(stage, time, { zoom: 0.008, y: 0 });
        twinkle(L.stars, time);
      },
    });
  </script>
</body>
</html>
