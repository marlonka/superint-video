<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../kit/theme.css">
  <style>
    .ui { justify-content: flex-start; padding-top: 22vh; }
    .sign { margin-top: 4vmin; }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="stage" id="stage"><svg class="art" id="art"></svg></div>
  <div class="ui"><p class="kicker" id="kicker"></p><p class="statement" id="text"></p><div class="small sign" id="sign"></div></div>
  <div class="vignette"></div>
  <script type="module">
    import { defineScene } from '/runtime/scene.js';
    import { fontsReady, once, fitSvg, el, orb, color, enter, drift, rise, splitWords, revealWords, fitText, random, starField, twinkle } from '../kit/kit.js';

    const stage = document.getElementById('stage'), art = document.getElementById('art');
    const $ = id => document.getElementById(id);

    // A huge planet horizon at the bottom; motes rise from it like embers.
    const layout = once(({ width, height }) => {
      const L = fitSvg(art, width, height);
      L.stars = starField(art, { w: width, h: height, seed: 'outro', count: 120 });
      L.motes = Array.from({ length: 36 }, (_, i) => el('circle', { r: L.u * (0.25 + random('mote', i) * 0.5), fill: color(i % 3 ? 'sun' : 'orange') }, art));
      L.horizonR = Math.max(width, height) * 1.1;
      L.horizon = orb(art, { r: L.horizonR, fill: color('dusk'), glow: true, bands: 5, highlight: true });
      return L;
    });

    defineScene({
      ready: fontsReady,
      props: {
        kicker: { type: 'text', default: 'Also:', label: 'Kicker' },
        text: { type: 'text', default: 'Der Himmel ist blau, weil *kurzes Licht* stärker streut', label: 'Takeaway (*word* = accent)' },
        sign: { type: 'text', default: '', label: 'Sign-off (optional)' },
      },
      render(context) {
        const { time, props } = context;
        const L = layout(context);
        $('kicker').textContent = props.kicker;
        $('sign').textContent = props.sign;
        const text = $('text');
        const words = splitWords(text, props.text);
        if (text.dataset.fitted !== props.text) {
          fitText(text, { max: 6.6, width: L.w * 0.84, lines: 4 });
          text.dataset.fitted = props.text;
        }
        rise($('kicker'), enter(time, 0.1));
        revealWords(words, time, 0.3, 0.07);
        rise($('sign'), enter(time, 0.6 + words.length * 0.07));

        const rise01 = enter(time, 0, { stiffness: 30, damping: 12 });
        const top = L.h * (L.portrait ? 0.78 : 0.74);
        L.horizon.setAttribute('transform', `translate(${L.w / 2} ${top + L.horizonR + (1 - rise01) * L.h * 0.3})`);
        L.motes.forEach((m, i) => {
          const speed = 0.05 + random('ms', i) * 0.08;
          const y = 1 - ((time * speed + random('my', i)) % 1);
          m.setAttribute('cx', random('mx', i) * L.w + Math.sin(time + i) * L.u);
          m.setAttribute('cy', top - (1 - y) * L.h * 0.5);
          m.setAttribute('opacity', Math.sin(y * Math.PI) * 0.8 * Math.min(1, time));
        });
        drift(stage, time, { zoom: 0.006, y: 0.1 });
        twinkle(L.stars, time);
      },
    });
  </script>
</body>
</html>
